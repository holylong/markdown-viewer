<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Markdown Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand" title="Markdown Viewer">
          <span class="brand-mark">M</span>
          <span class="brand-name">Markdown Viewer</span>
        </div>
        <div class="toolbar-group toolbar-primary">
          <button id="sidebar-btn" class="icon-btn active" title="显示或隐藏文件夹侧边栏 (Ctrl+B)" aria-label="显示或隐藏侧边栏">☰</button>
          <button id="new-btn" class="btn" title="新建文档 (Ctrl+N)">新建</button>
          <button id="open-btn" class="btn" title="打开文件 (Ctrl+O)">打开</button>
          <button id="open-folder-btn" class="btn" title="打开文件夹 (Ctrl+Shift+O)">打开文件夹</button>
          <button id="save-btn" class="btn" title="保存 (Ctrl+S)" disabled>保存</button>
          <button id="save-as-btn" class="btn" title="另存为 (Ctrl+Shift+S)" disabled>另存为</button>
        </div>
        <div class="toolbar-actions">
          <div class="view-toggle" aria-label="视图模式">
            <button id="view-edit-btn" class="btn view-btn" title="仅编辑">编辑</button>
            <button id="view-split-btn" class="btn view-btn active" title="编辑与预览">分屏</button>
            <button id="view-preview-btn" class="btn view-btn" title="仅预览">预览</button>
          </div>
          <div class="export-menu">
            <button id="export-btn" class="btn" disabled>导出</button>
            <div id="export-popover" class="popover" hidden>
              <button id="export-pdf-btn" class="popover-item" disabled>导出 PDF</button>
              <button id="export-doc-btn" class="popover-item" disabled>导出 Word (.docx)</button>
              <button id="export-html-btn" class="popover-item" disabled>导出 HTML</button>
            </div>
          </div>
          <button id="theme-btn" class="icon-btn" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
        </div>
      </header>

      <div class="app-body">
        <nav class="activity-bar" aria-label="功能导航">
          <div class="activity-primary">
            <button id="activity-files-btn" class="activity-btn active" type="button" data-sidebar-target="files" title="文件夹" aria-label="文件夹" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h5l2 2h7a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z" /></svg>
            </button>
            <button id="activity-history-btn" class="activity-btn" type="button" data-sidebar-target="history" title="操作历史" aria-label="操作历史" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.68M4 4v4.68h4.68M12 7.5V12l3 2" /></svg>
            </button>
            <button id="activity-plugins-btn" class="activity-btn" type="button" data-sidebar-target="plugins" title="插件" aria-label="插件" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5h3v4h3v-4h3v4A3.5 3.5 0 0 1 14 11v3l-4 4v2.5H6V17l4-4v-2A3.5 3.5 0 0 1 6.5 7.5v-4z" /></svg>
            </button>
          </div>
          <button id="activity-settings-btn" class="activity-btn" type="button" data-sidebar-target="settings" title="设置" aria-label="设置" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM19 12a7 7 0 0 0-.1-1.15l2-1.55-2-3.45-2.45 1a7 7 0 0 0-2-1.15L14.1 3h-4l-.4 2.7a7 7 0 0 0-2 1.15l-2.45-1-2 3.45 2 1.55A7 7 0 0 0 5.15 12a7 7 0 0 0 .1 1.15l-2 1.55 2 3.45 2.45-1a7 7 0 0 0 2 1.15l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.15l2.45 1 2-3.45-2-1.55A7 7 0 0 0 19 12z" /></svg>
          </button>
        </nav>

        <aside id="sidebar" class="sidebar">
          <section class="sidebar-panel" data-sidebar-panel="files">
            <div class="sidebar-header">
              <div>
                <span class="eyebrow">工作区</span>
                <div id="folder-name" class="folder-name" title="">未打开文件夹</div>
              </div>
              <button id="refresh-folder-btn" class="icon-btn subtle" title="刷新文件夹" aria-label="刷新文件夹" disabled>↻</button>
            </div>
            <div class="sidebar-tools">
              <input id="file-filter" class="file-filter" type="search" placeholder="筛选文档…" aria-label="筛选文档" disabled />
            </div>
            <div id="file-tree" class="file-tree" role="tree">
              <div class="sidebar-placeholder">
                <span class="placeholder-icon">◇</span>
                <p>打开一个文件夹<br />集中管理 Markdown 文档</p>
                <button id="sidebar-open-folder-btn" class="btn accent-btn">打开文件夹</button>
              </div>
            </div>
            <div class="sidebar-footer">
              <span id="folder-stats">本地优先 · 数据留在设备上</span>
            </div>
          </section>

          <section class="sidebar-panel" data-sidebar-panel="history" hidden>
            <div class="sidebar-header compact-header">
              <div>
                <span class="eyebrow">本地记录</span>
                <div class="folder-name">操作历史</div>
              </div>
              <button id="clear-history-btn" class="icon-btn subtle" title="清空操作历史" aria-label="清空操作历史">⌫</button>
            </div>
            <div id="activity-history-list" class="activity-history-list"></div>
          </section>

          <section class="sidebar-panel" data-sidebar-panel="plugins" hidden>
            <div class="sidebar-header compact-header">
              <div>
                <span class="eyebrow">扩展能力</span>
                <div class="folder-name">插件</div>
              </div>
            </div>
            <div class="sidebar-feature-card">
              <span class="feature-icon">◇</span>
              <strong>插件中心</strong>
              <p>后续可在这里安装 Markdown 扩展、导出器和主题插件。</p>
              <button id="browse-plugins-btn" class="btn" type="button">查看插件规划</button>
            </div>
          </section>

          <section class="sidebar-panel" data-sidebar-panel="settings" hidden>
            <div class="sidebar-header compact-header">
              <div>
                <span class="eyebrow">应用偏好</span>
                <div class="folder-name">设置</div>
              </div>
            </div>
            <div class="settings-list">
              <div class="settings-group">
                <span class="settings-label">外观主题</span>
                <div class="settings-options">
                  <button id="settings-light-btn" class="btn setting-option" type="button">浅色</button>
                  <button id="settings-dark-btn" class="btn setting-option" type="button">深色</button>
                </div>
              </div>
              <div class="settings-group">
                <span class="settings-label">编辑器视图</span>
                <div class="settings-options settings-options-stack">
                  <button class="btn setting-option" type="button" data-settings-view="edit">仅编辑</button>
                  <button class="btn setting-option" type="button" data-settings-view="split">编辑与预览</button>
                  <button class="btn setting-option" type="button" data-settings-view="preview">仅预览</button>
                </div>
              </div>
            </div>
          </section>
        </aside>

        <main class="main-area">
          <div id="tabs-bar" class="tabs-bar" hidden>
            <div id="tabs" class="tabs" role="tablist"></div>
            <button id="new-tab-btn" class="new-tab-btn" title="新建文档 (Ctrl+N)" aria-label="新建文档">＋</button>
          </div>

          <div id="content">
            <div id="empty" class="empty">
              <div class="empty-card">
                <div class="empty-icon">M</div>
                <h1>开始写作</h1>
                <p>新建文档，或打开已有的 Markdown 文件和工作区。</p>
                <div class="empty-actions">
                  <button id="empty-new-btn" class="btn accent-btn">新建文档</button>
                  <button id="empty-open-btn" class="btn">打开文件</button>
                  <button id="empty-folder-btn" class="btn">打开文件夹</button>
                </div>
                <div id="recent-section" class="recent-section" hidden>
                  <span class="eyebrow">最近打开</span>
                  <div id="recent-list" class="recent-list"></div>
                </div>
              </div>
            </div>
            <div id="workspace" class="workspace" data-view="split" hidden>
              <div id="editor-pane" class="pane editor-pane"></div>
              <div
                id="pane-resizer"
                class="pane-resizer"
                role="separator"
                aria-label="调整编辑与预览区域宽度"
                aria-orientation="vertical"
                aria-valuemin="15"
                aria-valuemax="85"
                aria-valuenow="50"
                tabindex="0"
                title="拖动调整比例，双击恢复 50/50"
              ></div>
              <div id="markdown" class="pane preview-pane markdown-body"></div>
            </div>
          </div>

          <footer id="statusbar" class="statusbar" hidden>
            <span id="file-path" class="status-path"></span>
            <div class="status-metrics">
              <span id="save-state">已保存</span>
              <span id="cursor-position">行 1，列 1</span>
              <span id="document-stats">0 字 · 0 字符</span>
              <span>Markdown</span>
            </div>
          </footer>
        </main>
      </div>
    </div>
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div><strong>释放以打开</strong><span>支持多个 Markdown 文件</span></div>
    </div>
    <dialog id="app-dialog" class="app-dialog">
      <div class="dialog-body">
        <p id="dialog-message" class="dialog-message"></p>
        <input id="dialog-input" class="dialog-input" type="text" hidden />
        <div class="dialog-actions">
          <button id="dialog-cancel" class="btn dialog-btn">取消</button>
          <button id="dialog-ok" class="btn accent-btn dialog-btn">确定</button>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
